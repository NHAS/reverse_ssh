# Security Settings
insecure = false
open_proxy = false

# Network Settings
listen_address = ":2222"
external_address = "your.server.com:2222"
timeout = 50

# TLS Settings
tls = true
tls_cert = "server.crt"
tls_key = "server.key"

# Features
enable_client_downloads = true

# Logging
log_level = "info"
console_label = "catcher"

# Paths
data_dir = "./data"
